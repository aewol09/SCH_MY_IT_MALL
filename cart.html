<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니 - SCH My IT Mall</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <header id="main-header">
        <div class="wrapper header-content">
            <a href="Main_Page.html" class="logo">
                <i data-lucide="cpu" style="color: var(--primary);"></i>
                <span>SCH</span> IT Mall
            </a>
            <div class="user-menu">
                <a href="login.html">로그인</a>
                <a href="register.html">회원가입</a>
                <a href="Presentation.html">사이트 소개</a>
                <a href="cart.html" class="cart-icon">
                    <i data-lucide="shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <nav>
        <div class="wrapper">
            <a href="Main_Page.html">홈</a>
            <a href="notebook.html">노트북</a>
            <a href="smartphone.html">스마트폰</a>
            <a href="tablet.html">테블릿</a>
            <a href="peripheral.html">주변기기</a>
        </div>
    </nav>

    <main class="wrapper" style="margin-top: 3rem; margin-bottom: 4rem;">
        <h1 style="font-size: 2rem; margin-bottom: 2rem; text-align: center;">Shopping Cart</h1>

        <div style="max-width: 900px; margin: 0 auto;">
            <div class="cart-list" id="cart-items-container">
                <!-- JavaScript will populate items here -->
                <div style="padding: 4rem; text-align: center; color: var(--secondary);">
                    <i data-lucide="shopping-bag" size="48" style="margin-bottom: 1rem; opacity: 0.5;"></i>
                    <p>장바구니가 비어있습니다.</p>
                </div>
            </div>

            <div id="cart-summary-container" style="display: none; margin-top: 2rem; padding: 2rem; background: var(--light); border-radius: var(--radius);">
                <div style="display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 800; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                    <span>총 결제 예정 금액</span>
                    <span style="color: var(--primary);" id="total-price">₩0</span>
                </div>
                <button class="btn-block" style="margin-top: 2rem; padding: 1.25rem;">주문하기</button>
            </div>
        </div>
    </main>

    <footer style="margin-top: 4rem; border-top: 1px solid var(--border); padding: 3rem 0; background: #fff;">
        <div class="wrapper" style="text-align: center;">
            <a href="Main_Page.html" class="logo" style="justify-content: center; margin-bottom: 1rem;">
                <i data-lucide="cpu" size="20"></i>
                <span>SCH</span> IT Mall
            </a>
            <p style="font-size: 0.875rem; color: var(--secondary);">&copy; 2026 SCH My IT Mall. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="scripts.js"></script>
    <script>
        lucide.createIcons();
        
        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const summary = document.getElementById('cart-summary-container');
            const totalPriceEl = document.getElementById('total-price');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div style="padding: 4rem; text-align: center; color: var(--secondary);">
                        <i data-lucide="shopping-bag" size="48" style="margin-bottom: 1rem; opacity: 0.5;"></i>
                        <p>장바구니가 비어있습니다.</p>
                    </div>
                `;
                summary.style.display = 'none';
                lucide.createIcons();
                return;
            }

            summary.style.display = 'block';
            let total = 0;

            container.innerHTML = cart.map((item, index) => {
                const price = PRODUCT_PRICES[item.name] || 0; 
                const subtotal = price * item.quantity;
                total += subtotal;
                return `
                    <div class="cart-item" style="display: grid; grid-template-columns: 1fr auto auto; gap: 2rem; padding: 1.5rem; border-bottom: 1px solid var(--border); align-items: center;">
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <div style="width: 50px; height: 50px; background: var(--light); border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                                <i data-lucide="package" size="24"></i>
                            </div>
                            <div>
                                <p style="font-weight: 700;">${item.name}</p>
                                <p style="font-size: 0.75rem; color: var(--secondary);">수량: ${item.quantity}</p>
                            </div>
                        </div>
                        <div style="font-weight: 700; color: var(--primary);">₩${subtotal.toLocaleString()}</div>
                        <button onclick="removeFromCart(${index})" style="background:none; border:none; color: var(--secondary); cursor:pointer;">
                            <i data-lucide="trash-2" size="18"></i>
                        </button>
                    </div>
                `;
            }).join('');
            
            totalPriceEl.innerText = `₩${total.toLocaleString()}`;
            lucide.createIcons();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
            updateCartCount();
        }

        window.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>

</html>
