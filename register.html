<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - SCH My IT Mall</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <header id="main-header">
        <div class="wrapper header-content">
            <a href="Main_Page.html" class="logo">
                <i data-lucide="cpu" style="color: var(--primary);"></i>
                <span>SCH</span> IT Mall
            </a>
            <div class="user-menu">
                <a href="login.html">로그인</a>
                <a href="register.html">회원가입</a>
                <a href="Presentation.html">사이트 소개</a>
                <a href="cart.html" class="cart-icon">
                    <i data-lucide="shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="wrapper">
        <div class="auth-container" style="max-width: 600px;">
            <div style="text-align: center; margin-bottom: 3rem;">
                <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Create Account</h1>
                <p style="color: var(--secondary); font-size: 0.875rem;">SCH IT Mall의 멤버가 되어 특별한 혜택을 누려보세요.</p>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                <div class="form-group">
                    <label for="reg-id">아이디*</label>
                    <input type="text" id="reg-id" placeholder="4~12자 영문/숫자">
                </div>
                <div class="form-group">
                    <label for="reg-name">이름*</label>
                    <input type="text" id="reg-name" placeholder="실명을 입력하세요">
                </div>
            </div>

            <div class="form-group">
                <label for="reg-pw">비밀번호*</label>
                <input type="password" id="reg-pw" placeholder="8자 이상의 비밀번호">
            </div>

            <div class="form-group">
                <label for="reg-pw-confirm">비밀번호 확인*</label>
                <input type="password" id="reg-pw-confirm" placeholder="비밀번호를 다시 입력하세요">
            </div>

            <div class="form-group">
                <label for="reg-email">이메일*</label>
                <input type="email" id="reg-email" placeholder="example@email.com">
            </div>

            <div class="form-group">
                <label for="reg-phone">휴대폰 번호*</label>
                <input type="text" id="reg-phone" placeholder="숫자만 입력 (예: 01012345678)">
            </div>

            <div style="margin: 2.5rem 0; padding: 1.5rem; background: var(--light); border-radius: var(--radius); border: 1px solid var(--border);">
                <label style="display: flex; align-items: flex-start; gap: 0.75rem; font-size: 0.875rem; cursor: pointer;">
                    <input type="checkbox" id="terms-all" style="width: auto; margin-top: 0.25rem;">
                    <span>
                        <strong>전체 동의하기</strong><br>
                        <span style="color: var(--secondary); font-size: 0.8125rem;">이용약관 및 개인정보 수집 및 이용, 쇼핑정보 수신(선택)에 모두 동의합니다.</span>
                    </span>
                </label>
            </div>

            <button class="btn-block" onclick="validateRegister()">가입하기</button>

            <div style="margin-top: 2rem; text-align: center; font-size: 0.875rem; color: var(--secondary); border-top: 1px solid var(--border); padding-top: 2rem;">
                이미 계정이 있으신가요? <a href="login.html" style="color: var(--primary); font-weight: 700;">로그인</a>
            </div>
        </div>
    </main>

    <footer style="margin-top: 4rem; border-top: 1px solid var(--border); padding: 4rem 0; background: var(--dark); color: var(--white);">
        <div class="wrapper" style="text-align: center;">
            <a href="Main_Page.html" class="logo" style="justify-content: center; margin-bottom: 1.5rem; color: var(--white);">
                <i data-lucide="cpu" style="color: var(--primary);"></i>
                <span>SCH</span> IT Mall
            </a>
            <div style="display: flex; justify-content: center; gap: 2rem; margin-bottom: 2rem; font-size: 0.875rem; opacity: 0.7;">
                <a href="Presentation.html">사이트 소개</a>
                <a href="#">이용약관</a>
                <a href="#">개인정보처리방침</a>
                <a href="#">고객센터</a>
            </div>
            <p style="font-size: 0.8125rem; opacity: 0.4;">&copy; 2026 SCH My IT Shopping Mall. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="scripts.js"></script>
    <script>
        lucide.createIcons();
        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            if (window.scrollY > 50) header.classList.add('scrolled');
            else header.classList.remove('scrolled');
        });
    </script>
</body>

</html>
