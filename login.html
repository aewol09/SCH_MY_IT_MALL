<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - SCH My IT Mall</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="wrapper header-content">
            <a href="Main_Page.html" class="logo">SCH My IT Mall</a>
            <div class="user-menu">
                <a href="login.html">로그인</a>
                <a href="register.html">회원가입</a>
                <a href="Presentation.html">사이트 소개</a>
            </div>
        </div>
    </header>

    <div class="wrapper">
        <div class="form-container">
            <h2 class="form-title">로그인</h2>
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" placeholder="아이디를 입력하세요">
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요">
            </div>
            <button class="btn-submit" onclick="validateLogin()">로그인</button>
            <div id="message" style="color: var(--error-color); text-align: center; margin-top: 15px; font-size: 14px;"></div>
            
            <div style="margin-top: 20px; text-align: center; font-size: 14px; color: var(--secondary-color);">
                계정이 없으신가요? <a href="register.html" style="color: var(--primary-color);">회원가입</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 SCH My IT Shopping Mall. All Rights Reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
