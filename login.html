<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - SCH My IT Mall</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <header id="main-header">
        <div class="wrapper header-content">
            <a href="Main_Page.html" class="logo">
                <i data-lucide="cpu" style="color: var(--primary);"></i>
                <span>SCH</span> IT Mall
            </a>
            <div class="user-menu">
                <a href="login.html">로그인</a>
                <a href="register.html">회원가입</a>
                <a href="Presentation.html">사이트 소개</a>
                <a href="cart.html" class="cart-icon">
                    <i data-lucide="shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="wrapper">
        <div class="auth-container">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome Back</h1>
                <p style="color: var(--secondary); font-size: 0.875rem;">SCH IT Mall에 오신 것을 환영합니다.</p>
            </div>

            <div class="form-group">
                <label for="username">아이디</label>
                <div style="position: relative;">
                    <i data-lucide="user" size="18" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--secondary);"></i>
                    <input type="text" id="username" placeholder="아이디를 입력하세요" style="padding-left: 3rem;">
                </div>
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <div style="position: relative;">
                    <i data-lucide="lock" size="18" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--secondary);"></i>
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요" style="padding-left: 3rem;">
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; font-size: 0.875rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" style="width: auto;"> 로그인 상태 유지
                </label>
                <a href="#" style="color: var(--primary); font-weight: 500;">비밀번호를 잊으셨나요?</a>
            </div>

            <button class="btn-block" onclick="validateLogin()">로그인</button>

            <div id="message" style="color: var(--error); text-align: center; margin-top: 1.5rem; font-size: 0.875rem; min-height: 1.25rem;"></div>

            <div style="margin-top: 2rem; text-align: center; font-size: 0.875rem; color: var(--secondary); border-top: 1px solid var(--border); padding-top: 2rem;">
                아직 회원이 아니신가요? <a href="register.html" style="color: var(--primary); font-weight: 700;">회원가입</a>
            </div>
        </div>
    </main>

    <footer style="margin-top: 4rem; border-top: 1px solid var(--border); padding: 4rem 0; background: var(--dark); color: var(--white);">
        <div class="wrapper" style="text-align: center;">
            <a href="Main_Page.html" class="logo" style="justify-content: center; margin-bottom: 1.5rem; color: var(--white);">
                <i data-lucide="cpu" style="color: var(--primary);"></i>
                <span>SCH</span> IT Mall
            </a>
            <div style="display: flex; justify-content: center; gap: 2rem; margin-bottom: 2rem; font-size: 0.875rem; opacity: 0.7;">
                <a href="Presentation.html">사이트 소개</a>
                <a href="#">이용약관</a>
                <a href="#">개인정보처리방침</a>
                <a href="#">고객센터</a>
            </div>
            <p style="font-size: 0.8125rem; opacity: 0.4;">&copy; 2026 SCH My IT Shopping Mall. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="scripts.js"></script>
    <script>
        lucide.createIcons();
        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            if (window.scrollY > 50) header.classList.add('scrolled');
            else header.classList.remove('scrolled');
        });
    </script>
</body>

</html>
